id: paper-mario-kmr-03-entry-2
game: paper_mario
status: active
description: >
  First player control in `kmr_03` after Mario's veranda fall, entered through
  ENTRY_2, in world mode. The authority is imported from a qualified
  frame-stepped Linux progression recording; it replaces the retired
  `paper-mario-kmr-03-entry-5` authority, whose retained state decoded as
  area 6/map 5/entry 2 (the nok_12 attract demo).

content:
  rom_path: assets/Paper Mario (USA).zip
  core: parallel_n64
  savefile_path: ""
  hires_pack_path: artifacts/hts2phrb-review/local-pm64-zero-config/package.phrb

entry:
  method: savestate
  reference: kmr_03_entry_2
  authority: authoritative_kmr_03_entry_2_savestate
  target_state: kmr_03_entry_2_idle

scene_identity:
  map: kmr_03
  entry: ENTRY_2
  # Decoded GameStatus values the runtime verifier compares.
  decoded:
    area_id: 0
    map_name: kmr_03
    entry_id: 2

authority:
  graph_path: tools/fixtures/paper-mario-authority-graph.yaml
  node_id: kmr_03_entry_2_idle
  preferred_mode: authoritative
  bootstrap_parent_fixture_id: ""
  remint_script: tools/scenarios/remint-paper-mario-kmr-03-entry-2-authority.sh

requirements:
  assets:
    - assets/Paper Mario (USA).zip
    - artifacts/hts2phrb-review/local-pm64-zero-config/package.phrb
    - assets/states/paper-mario-kmr-03-entry-2/ParaLLEl N64/Paper Mario (USA).state
  environment:
    - RetroArch must be supplied through the scenario's binary/config inputs

runtime:
  internal_scale: 4x
  execution_mode: serial
  display_required: true

capture:
  screenshots:
    - kmr_03_entry_2
  frames:
    - kmr_03_entry_2
  logs: true
  memory: false
  traces:
    - config_snapshot
    - paper_mario_game_status
    - fallback_reporting
    - replacement_hit_miss_summary

checks:
  visual:
    - the `kmr_03 ENTRY_2` world scene renders without corruption
    - baseline-off mode remains visually safe
  telemetry:
    - bundle includes ROM hash
    - bundle includes hi-res pack hash when present
    - bundle includes config snapshot
    - bundle includes the active authority mode and active state hash
  traces:
    - bundle records fallback reasons when replacement is not applied
    - bundle records semantic world-state evidence for `state_init_world` / `state_step_world`
    - qualified GameStatus decoding reports area 0, map `kmr_03`, entry 2

notes:
  - The canonical steady-state contract is `load savestate paused -> settle 3 frames -> screenshot`.
  - Source is the `landing-control` checkpoint of a qualified frame-stepped Linux progression recording, saved at session frame 10230 and decoded there as kmr_03 entry 2, story progress -122, HP 10, world mode.
  - The savestate carries progression; no savefile is staged.
  - Source identity is the decompressed M64+SAVE body sha256 `e98271b65bfa81c5f18ceefd10a141eb4e2bc878aa28003783b1b12a82757d2d`; the recorded RetroArch file sha256 is `bff85c1ba9fae1d3a36cd9d049a552fd74b684211272ba419d84a49f50478783`.
  - The feature-off steady-state capture digest was pinned by the first runtime remint (October 16, 2026, headed X11 RADV) and is mirrored in the runtime env and graph node; the remint helper refuses publication on any other digest.
